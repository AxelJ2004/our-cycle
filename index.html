<style>
/* Layout: one calm phone column. Today (phase ring), Calendar (month grid), Notes (shared), bottom tab bar, full-screen setup tour. */
:root{
  --bg:#F5F3F8; --surface:#FFFFFF; --ink:#241F31; --muted:#6C667B; --line:#E2DEEA; --soft:#EEEAF4;

  --display:'Bricolage Grotesque','Noto Sans KR',ui-rounded,system-ui,-apple-system,sans-serif;
  --body:'Figtree','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121B; --surface:#201B29; --ink:#F2EFF7; --muted:#A8A2B8; --line:#352F42; --soft:#2A2435;
    --rose:#F26E92; --rose-soft:#4B2433; --on-rose:#2B0E18;
    --teal:#55CDBD; --teal-soft:#1B3B38;
    --ring:#CFC8E6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121B; --surface:#201B29; --ink:#F2EFF7; --muted:#A8A2B8; --line:#352F42; --soft:#2A2435;
  --rose:#F26E92; --rose-soft:#4B2433; --on-rose:#2B0E18;
  --teal:#55CDBD; --teal-soft:#1B3B38;
  --ring:#CFC8E6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
p,h1,h2,h3{margin:0}
.app{max-width:520px;margin:0 auto;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));min-height:70vh}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:700 34px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin-top:6px;max-width:44ch}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:0;font-weight:600;font-size:17px;padding:0 18px;background:var(--ink);color:var(--bg)}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}

.cell{position:relative;aspect-ratio:1;border-radius:14px;border:1.5px solid transparent;background:var(--surface);display:grid;place-items:center;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;padding:0;min-width:0}

.cell.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cell .ov{position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--teal)}
.cell .nt{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.cell.period .nt{background:var(--on-rose)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:6px;display:inline-block}
.sw.period{background:var(--rose)} .sw.pred{border:1.5px dashed var(--rose)} .sw.fertile{background:var(--teal-soft);border:1px solid var(--teal)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(15,10,22,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out;box-shadow:var(--shadow)}

.row .lbl span{font-size:14px;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}

.step output{min-width:2ch;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.sec{margin-top:20px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tour{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tour-in{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.tour-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--ink)}
.dots i.done{background:var(--rose)}
.tour-body{flex:1;overflow:auto;padding:28px 0 12px}

.tour-body .unit{text-align:center;color:var(--muted);margin-top:8px}
.points{display:grid;gap:12px;margin-top:24px;padding:0;list-style:none}
.points li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.points .ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.points .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.points b{display:block}
.points span{color:var(--muted);font-size:15px}
.tour-foot{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.tour-foot.solo{grid-template-columns:1fr}
.tour-foot .btn.ghost{width:auto;padding:0 20px}

:root{--pet:#F8B9C9;--pet-belly:#FDE3EA;--pet-gill:#E98BA6;--pet-ink:#3A2A3C}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
.wish{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px 8px 8px;margin-bottom:8px}

.timecard{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-top:6px}

.timecard .r{text-align:right;min-width:0}

.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}

.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.mood{display:grid;justify-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;min-width:0}
.mood svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mood[aria-pressed=true]{border-color:var(--ink);background:var(--surface)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}

.item .cost svg{width:14px;height:14px;fill:var(--rose)}
.item .btn{width:100%}
.fx{position:fixed;z-index:70;pointer-events:none;width:26px;height:26px;margin:-13px 0 0 -13px;color:var(--rose);animation:floatUp .9s ease-out forwards}
.fx svg{width:100%;height:100%;fill:currentColor}
@keyframes floatUp{from{transform:translateY(0) scale(.7);opacity:1}to{transform:translateY(-70px) scale(1.15);opacity:0}}

@media (prefers-reduced-motion: reduce){.panel{animation:none}}
</style>

function getModel(){
  var starts=Object.keys(state.periods).map(function(k){return state.periods[k];})
    .filter(function(p){return p&&p.start;})
    .map(function(p){return {s:toDay(p.start),e:p.end?toDay(p.end):null};})
    .sort(function(a,b){return a.s-b.s;});
  var gaps=[];
  for(var i=1;i<starts.length;i++)gaps.push(starts[i].s-starts[i-1].s);

function dayInfo(n,M){
  var st=M.starts;
  if(!st.length||n<st[0].s)return null;
  var i=st.length-1;

    if(k>0){start=p.s+k*len;projected=true;plen=M.plen;}

  var o=n-start,ov=len-14,phase;
  if(o<plen)phase='period';

}

function summary(M,T){
  var L=M.last;
  if(!L||T<L.s)return null;
  var cyc=M.cycle,info=dayInfo(T,M);
  var nextStart=L.s+cyc,late=T-nextStart;

}

function dayKind(n,M,T){
  var i=dayInfo(n,M),out={};
  if(!i||!M.last)return out;
  if(i.phase==='period'){
    if(!i.projected){if(i.p.e!==null||n<=T)out.period=true;else out.pred=true;}
    else out.pred=true;
  }else if(i.phase==='fertile'&&n>=M.last.s){out.fertile=true;}
  if(i.isOv&&n>=M.last.s)out.ov=true;
  return out;
}

function messagesFor(n,info){
  var all=Object.keys(state.messages).map(function(id){var m=state.messages[id];return {id:id,text:m.text,kind:m.kind,date:m.date,by:m.by,lang:m.lang,tr:m.tr,createdAt:m.createdAt||0};})
    .sort(function(a,b){return a.createdAt-b.createdAt||(a.id<b.id?-1:1);});
  var byKind=function(k){return all.filter(function(m){return m.kind===k;});};
  var pick=function(a){return a.length?[a[n%a.length]]:[];};
  var d=all.filter(function(m){return m.kind==='date'&&m.date===toStr(n);});
  if(d.length)return d;
  var r;
  if(info&&!info.projected&&info.first){r=pick(byKind('day1'));if(r.length)return r;}
  if(info&&!info.projected&&info.phase==='period'){r=pick(byKind('period'));if(r.length)return r;}
  if(info&&info.pms){r=pick(byKind('pms'));if(r.length)return r;}
  return pick(byKind('daily'));
}
function earnedHearts(){
  var e=3*Object.keys(state.checkins).length;
  Object.keys(state.hearts).forEach(function(k){var h=state.hearts[k];if(h&&h.claimed)e+=(+h.n||0);});
  return e;
}
function streakDays(T){
  var d=T,s=0;
  if(!state.checkins[toStr(d)])d=T-1;
  while(state.checkins[toStr(d)]){s++;d--;}

}

}

}

}

/* ---------- note helpers ---------- */
function textIn(m,lang){
  if((m.lang||'en')===lang)return m.text;
  if(m.tr&&m.tr[lang])return m.tr[lang];
  if(m.id&&ui.tmp[m.id+':'+lang])return ui.tmp[m.id+':'+lang];
  return m.text;
}
function noteTextFor(m,lang){return textIn(m,lang);}
function noteText(m){return ui.orig[m.id]?m.text:textIn(m,ui.lang);}
function hasTr(m){return (m.lang||'en')!==ui.lang&&!!((m.tr&&m.tr[ui.lang])||(m.id&&ui.tmp[m.id+':'+ui.lang]));}
function trBtn(coll,m){
  if((m.lang||'en')===ui.lang)return '';
  if(hasTr(m))return '<button class="chip mini" data-a="trToggle" data-id="'+esc(m.id)+'">'+esc(ui.orig[m.id]?t('showTranslation'):t('showOriginal'))+'</button>';
  if(!ui.sample)return '';
  return '<button class="chip mini" data-a="trDo" data-c="'+coll+'" data-id="'+esc(m.id)+'"'+(ui.busy[m.id]?' disabled':'')+'>'+esc(ui.busy[m.id]?t('translating'):t('translate'))+'</button>';
}
function caption(m){
  var by=m.by||'owner';
  if(by==='owner')return ui.owner?t('fromYou'):t('fromAxel');
  return ui.owner?t('fromHer'):t('fromYou');
}

/* ---------- storage ---------- */
var queues={};
function enqueue(path,fn){var q=(queues[path]||Promise.resolve()).catch(function(){}).then(fn);queues[path]=q;return q;}
function applyLocal(path,data){
  var p=path.split('/');
  if(p[0]==='cycle'){if(data)state.settings=Object.assign({},DEF,data);return;}
  if(p[0]==='pet'){state.pet=data||{};return;}
  if(data===null)delete state[p[0]][p[1]];else state[p[0]][p[1]]=data;
}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function loadLocal(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);state.settings=Object.assign({},DEF,s.settings||{});state.periods=s.periods||{};state.messages=s.messages||{};state.pet=s.pet||{};state.hearts=s.hearts||{};state.checkins=s.checkins||{};state.wishes=s.wishes||{};}
  }catch(e){}
}
function failed(e){toast(e&&e.code==='invalid_argument'?t('saveFailView'):t('saveFail'));}
function put(path,data){
  if(ui.mode==='db'){return enqueue(path,function(){return db.doc(path).set(data);}).catch(failed);}
  applyLocal(path,data);persistLocal();render();return Promise.resolve();
}
function del(path){
  if(ui.mode==='db'){return enqueue(path,function(){return db.doc(path).delete();}).catch(failed);}
  applyLocal(path,null);persistLocal();render();return Promise.resolve();
}
function newId(p){return (p||'m')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function tourDone(){try{return localStorage.getItem(TOUR_KEY)==='1';}catch(e){return false;}}
function markTour(){try{localStorage.setItem(TOUR_KEY,'1');}catch(e){}}

/* ---------- actions ---------- */
function logStart(n,quiet){
  var id=toStr(n);
  if(state.periods[id]){toast(t('alreadyLogged'));return;}
  put('periods/'+id,{start:id,end:null});
  if(!quiet)toast(t('startSaved'));
}
function logEnd(n){
  var M=getModel(),best=null;

function ringSvg(S){
  var R=92,C=2*Math.PI*R,cyc=S.cyc,ov=cyc-14;
  function seg(a,b,color,w,cap){

    return '<circle cx="110" cy="110" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="'+(cap||'butt')+'" stroke-dasharray="'+((b-a)*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-a*C).toFixed(2)+'" transform="rotate(-90 110 110)"/>';
  }
  var frac=Math.min(S.dayNum,cyc)/cyc;
  var col=S.phase==='period'?'var(--rose)':(S.phase==='fertile'?'var(--teal)':'var(--ring)');
  var ang=frac*2*Math.PI-Math.PI/2,dx=110+R*Math.cos(ang),dy=110+R*Math.sin(ang);
  return '<svg viewBox="0 0 220 220" role="img" aria-label="'+esc(t('ringLabel',S.dayNum,cyc))+'">'+
    '<circle cx="110" cy="110" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="14"/>'+
    seg(0,Math.min(S.plen,cyc)/cyc,'var(--rose-soft)',14)+
    seg(Math.max(0,ov-5)/cyc,Math.min(cyc,ov+2)/cyc,'var(--teal-soft)',14)+
    seg(0,frac,col,6,'round')+
    '<circle cx="'+dx.toFixed(2)+'" cy="'+dy.toFixed(2)+'" r="10" fill="var(--bg)"/>'+
    '<circle cx="'+dx.toFixed(2)+'" cy="'+dy.toFixed(2)+'" r="7" fill="'+col+'"/></svg>';
}

/* ---------- clock ---------- */
var TZ={owner:'Europe/Brussels',other:'Asia/Seoul'};
function wallMs(tz){
  var parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date());
  var o={};parts.forEach(function(p){o[p.type]=+p.value;});
  return Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute);
}
function clockParts(){
  var me=ui.owner?'owner':'other',them=ui.owner?'other':'owner',tz=TZ[them],d=new Date();
  var time=new Intl.DateTimeFormat(t('loc'),{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
  var day=new Intl.DateTimeFormat(t('loc'),{timeZone:tz,weekday:'short'}).format(d);
  var hour=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hourCycle:'h23'}).format(d),10);
  var diff=Math.round((wallMs(tz)-wallMs(TZ[me]))/36e5);
  var rel=diff===0?t('tzSame'):(diff>0?t('tzAhead',t('hoursN',diff)):t('tzBehind',t('hoursN',-diff)));
  var night=hour<7||hour>=23;
  return {time:time,sub:t(ui.owner?'timeSubHer':'timeSub')+' · '+day,rel:rel+(night?' · '+t(ui.owner?'sleepHintHer':'sleepHint'):'')};
}
function timeCard(){
  var c=clockParts();
  return '<section class="timecard" aria-label="'+esc(t(ui.owner?'timeTitleHer':'timeTitle'))+'"><div><p class="k">'+esc(t(ui.owner?'timeTitleHer':'timeTitle'))+'</p><p class="tm" id="clk-t">'+esc(c.time)+'</p></div>'+
    '<div class="r"><p class="s" id="clk-s">'+esc(c.sub)+'</p><p class="s" id="clk-r">'+esc(c.rel)+'</p></div></section>';
}
function updateClock(){
  if(!$('clk-t'))return;
  var c=clockParts();
  $('clk-t').textContent=c.time;$('clk-s').textContent=c.sub;$('clk-r').textContent=c.rel;
}

function burstAt(e,el,n){
  var r=el.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
  for(var i=0;i<(n||3);i++){
    var d=document.createElement('div');d.className='fx';
    d.style.left=(x+Math.random()*60-30)+'px';d.style.top=(y+Math.random()*20-10)+'px';
    d.innerHTML=ICON.heart;document.body.appendChild(d);
    setTimeout((function(n2){return function(){n2.remove();};})(d),950);

function doTranslate(coll,id){
  var m=state[coll]&&state[coll][id];
  if(!m||ui.busy[id])return;
  if(!ui.sample){toast(t('translateFail'));return;}
  var lang=ui.lang;
  ui.busy[id]=true;render();
  translateText(m.text,lang).then(function(out){
    if(!out)throw new Error('empty');
    ui.tmp[id+':'+lang]=out;ui.orig[id]=false;
    var cur=state[coll][id];
    if(ui.canWrite&&cur&&cur.text===m.text){
      var tr=Object.assign({},cur.tr||{});tr[cur.lang||'en']=cur.text;tr[lang]=out;
      put(coll+'/'+id,Object.assign({},cur,{tr:tr}));
    }
  }).catch(function(e){
    toast(t('translateFail'));
    if(e&&e.code==='not_granted')ui.sample=null;
  }).then(function(){delete ui.busy[id];render();if(ui.sheet&&ui.sheet.type==='day')renderSheet();});
}

/* ---------- sheets ---------- */
function openSheet(s){ui.sheet=s;renderSheet();}
function closeSheet(){ui.sheet=null;$('sheet').innerHTML='';}
function wrapSheet(label,inner){
  return '<div class="sheet"><div class="scrim" data-a="close"></div><section class="panel" role="dialog" aria-modal="true" aria-label="'+esc(label)+'" tabindex="-1"><div class="grab"></div>'+inner+'</section></div>';

function renderSheet(){
  var s=ui.sheet;if(!s){$('sheet').innerHTML='';return;}
  var html='';
  if(s.type==='day')html=wrapSheet(longDate(s.n),sheetDay(s.n));
  else if(s.type==='settings')html=wrapSheet(t('settings'),sheetSettings());
  else if(s.type==='note')html=wrapSheet(s.id?t('editNote'):t('newNote'),sheetNote(s));
  else if(s.type==='rename')html=wrapSheet(t('renameTitle'),sheetRename());
  else if(s.type==='wish')html=wrapSheet(s.id?t('editWish'):t('wishNew'),sheetWish(s));
  else if(s.type==='tour')html=sheetTour(s);
  $('sheet').innerHTML=html;

}

function langSeg(){

function sheetDay(n){
  var M=getModel(),T=todayN(),i=dayInfo(n,M);

  if(i){
    meta=(i.projected?t('predicted'):'')+t('cycleDayN',i.day)+' · '+t('ph_'+i.phase)+(i.phase==='fertile'&&ui.lang==='en'?t('estSuffix'):'');
  }
  var h='<h2>'+esc(longDate(n))+'</h2><p class="meta">'+esc(meta)+'</p><div class="stack" style="margin-top:18px">';
  var isStart=!!state.periods[toStr(n)];
  var canLog=ui.canWrite&&n<=T&&!(ui.owner&&ui.mode==='db');
  if(canLog&&!isStart)h+='<button class="btn rose" data-a="markStart" data-n="'+n+'">'+esc(t('firstDay'))+'</button>';
  var near=M.starts.some(function(p){return p.s<=n&&n-p.s<=14;});
  if(canLog&&near)h+='<button class="btn ghost" data-a="markEnd" data-n="'+n+'">'+esc(t('lastDay'))+'</button>';
  if(canLog&&isStart)h+='<button class="btn danger" data-a="rmPeriod" data-id="'+toStr(n)+'">'+esc(t('removeStart'))+'</button>';
  if(ui.canWrite&&n>T)h+='<p class="help">'+esc(t('futureHelp'))+'</p>';

  var ms=Object.keys(state.messages).map(function(id){var m=state.messages[id];return {id:id,m:m};}).filter(function(x){return x.m.kind==='date'&&x.m.date===toStr(n);});

function captureNote(){
  var s=ui.sheet;if(!s||s.type!=='note')return;

/* ---------- setup tour ---------- */
var TOUR_STEPS=5;
function openTour(){
  openSheet({type:'tour',step:0,date:'',plen:state.settings.periodLength,cyc:state.settings.cycleLength});
}
function tourStepper(k,v){
  return '<div class="big"><button data-a="tourAdj" data-k="'+k+'" data-d="-1" aria-label="−">−</button><output>'+v+'</output><button data-a="tourAdj" data-k="'+k+'" data-d="1" aria-label="+">+</button></div><p class="unit">'+esc(t('daysUnit'))+'</p>';
}
function sheetTour(s){
  var i=s.step,last=i===TOUR_STEPS-1,body='';
  var dots='';for(var d=0;d<TOUR_STEPS;d++)dots+='<i class="'+(d===i?'on':(d<i?'done':''))+'"></i>';
  if(i===0){
    body='<h1>'+esc(t('t0Title'))+'</h1><p class="lead">'+esc(t('t0Lead'))+'</p><div class="field" style="margin-top:28px">'+langSeg()+'</div>';
  }else if(i===1){
    body='<h1>'+esc(t('t1Title'))+'</h1><p class="lead">'+esc(t('t1Lead'))+'</p><div class="field"><label for="tour-date">'+esc(t('t1Label'))+'</label><input type="date" id="tour-date" value="'+esc(s.date)+'" max="'+toStr(todayN())+'"></div>';
  }else if(i===2){
    body='<h1>'+esc(t('t2Title'))+'</h1><p class="lead">'+esc(t('t2Lead'))+'</p>'+tourStepper('plen',s.plen);
  }else if(i===3){
    body='<h1>'+esc(t('t3Title'))+'</h1><p class="lead">'+esc(t('t3Lead'))+'</p>'+tourStepper('cyc',s.cyc);
  }else{
    body='<h1>'+esc(t('t4Title'))+'</h1><p class="lead">'+esc(t('t4Lead'))+'</p><ul class="points">'+
      '<li><span class="ic">'+ICON.today+'</span><div><b>'+esc(t('p1b'))+'</b><span>'+esc(t('p1s'))+'</span></div></li>'+
      '<li><span class="ic">'+ICON.cal+'</span><div><b>'+esc(t('p2b'))+'</b><span>'+esc(t('p2s'))+'</span></div></li>'+
      '<li><span class="ic">'+ICON.notes+'</span><div><b>'+esc(t('p3b'))+'</b><span>'+esc(t('p3s'))+'</span></div></li></ul>'+
      '<p class="fine">'+esc(t('p4s'))+' '+esc(t('disclaimer'))+'</p>';
  }
  var foot=(i>0?'<button class="btn ghost" data-a="tourBack">'+esc(t('back'))+'</button>':'')+
    '<button class="btn rose" data-a="'+(last?'tourFinish':'tourNext')+'">'+esc(last?t('finish'):t('next'))+'</button>';
  return '<div class="tour" role="dialog" aria-modal="true" aria-label="'+esc(t('stepOf',i+1,TOUR_STEPS))+'" tabindex="-1"><div class="tour-in">'+
    '<div class="tour-top"><div class="dots" role="img" aria-label="'+esc(t('stepOf',i+1,TOUR_STEPS))+'">'+dots+'</div>'+(last?'<span></span>':'<button class="btn link" data-a="tourSkip">'+esc(t('skip'))+'</button>')+'</div>'+
    '<div class="tour-body">'+body+'</div><div class="tour-foot'+(i>0?'':' solo')+'">'+foot+'</div></div></div>';
}
function tourFinish(){
  var s=ui.sheet;
  if(s.date&&toDay(s.date)>todayN()){toast(t('futureDate'));s.step=1;renderSheet();return;}
  setSettings({cycleLength:s.cyc,periodLength:s.plen});
  if(s.date&&!state.periods[s.date])logStart(toDay(s.date),true);
  markTour();closeSheet();ui.tab='today';render();window.scrollTo(0,0);
}

/* ---------- translate ---------- */
function translateNote(){
  captureNote();
  var s=ui.sheet,text=(s.text||'').trim();
  if(!text){toast(t('writeFirst'));return;}
  var toKo=(s.bl||ui.lang)!=='ko';
  var btn=$('tr-btn');if(btn){btn.disabled=true;btn.textContent=t('translating');}
  var prompt='Translate this short, affectionate message between partners into '+(toKo?'Korean. Use natural, warm 해요체 (casual but polite).':'English. Keep it natural and warm.')+' Reply with only the translation, no quotes, no notes.\n\n'+text;
  ui.sample(prompt,{cache:false}).then(function(r){
    var out=(r&&r.text||'').trim();
    if(!ui.sheet||ui.sheet.type!=='note')return;
    if(!out){toast(t('translateFail'));renderSheet();return;}
    ui.sheet.alt=out;ui.sheet.showAlt=true;renderSheet();
  }).catch(function(){toast(t('translateFail'));if(ui.sheet&&ui.sheet.type==='note')renderSheet();});
}

/* ---------- events ---------- */
function toast(msg){
  var x=$('toast');x.textContent=msg;x.hidden=false;
  clearTimeout(toast.h);toast.h=setTimeout(function(){x.hidden=true;},3800);
}
function syncKind(){
  var k=$('msg-kind').value;
  $('date-wrap').hidden=k!=='date';
  $('kind-help').textContent=t(KIND_HELP[k]);
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  if(a==='hideInstall'){try{localStorage.setItem('our-cycle-install','1');}catch(e){}render();return;}
  if(a==='tab'){ui.tab=el.dataset.v;render();window.scrollTo(0,0);}
  else if(a==='prev'||a==='next'){
    var d=a==='prev'?-1:1,m=ui.month.m+d,y=ui.month.y;
    if(m<0){m=11;y--;}if(m>11){m=0;y++;}
    ui.month={y:y,m:m};render();
  }
  else if(a==='day'){openSheet({type:'day',n:+el.dataset.n});}
  else if(a==='settings'){openSheet({type:'settings'});}
  else if(a==='close'){closeSheet();}
  else if(a==='lang'){setLang(el.dataset.l);}
  else if(a==='startToday'){if(canLog())logStart(todayN());}
  else if(a==='endToday'){if(canLog())logEnd(todayN());}
  else if(a==='openTour'){openTour();}
  else if(a==='tourNext'){var s1=ui.sheet;if(s1.step===1&&$('tour-date'))s1.date=$('tour-date').value;s1.step++;renderSheet();}
  else if(a==='tourBack'){var s2=ui.sheet;if(s2.step===1&&$('tour-date'))s2.date=$('tour-date').value;s2.step--;renderSheet();}
  else if(a==='tourSkip'){markTour();closeSheet();}
  else if(a==='tourFinish'){tourFinish();}
  else if(a==='tourAdj'){
    var s3=ui.sheet,k3=el.dataset.k,lim=k3==='plen'?[2,10]:[20,45];
    s3[k3]=Math.max(lim[0],Math.min(lim[1],s3[k3]+(+el.dataset.d)));renderSheet();
  }
  else if(a==='markStart'){if(canLog())logStart(+el.dataset.n);closeSheet();}
  else if(a==='markEnd'){if(canLog()&&logEnd(+el.dataset.n))closeSheet();}
  else if(a==='rmPeriod'){
    if(!canLog())return;
    del('periods/'+el.dataset.id);
    if(el.dataset.from==='settings'){setTimeout(renderSheet,0);}else closeSheet();
  }
  else if(a==='adj'){
    if(!canLog())return;
    var k=el.dataset.k,lim2=k==='cycleLength'?[20,45]:[2,10];
    var nv=Math.max(lim2[0],Math.min(lim2[1],state.settings[k]+(+el.dataset.d)));
    var patch={};patch[k]=nv;setSettings(patch);renderSheet();
  }
  else if(a==='newNote'){openSheet({type:'note',date:el.dataset.date||null,kind:el.dataset.date?'date':null});}
  else if(a==='editNote'){openSheet({type:'note',id:el.dataset.id});}
  else if(a==='idea'){
    var key=IDEAS[+el.dataset.i];
    if(el.dataset.inline){
      captureNote();ui.sheet.text=t('idea_'+key);ui.sheet.kind=key;renderSheet();
    }else{openSheet({type:'note',kind:key,text:t('idea_'+key)});}
  }
  else if(a==='translate'){translateNote();}
  else if(a==='trDo'){doTranslate(el.dataset.c,el.dataset.id);}
  else if(a==='trToggle'){ui.orig[el.dataset.id]=!ui.orig[el.dataset.id];render();}
  else if(a==='love'){
    var lm=state.messages[el.dataset.id];if(!lm)return;
    var side=ui.owner?'owner':'other',lv=Object.assign({},lm.loved||{});
    lv[side]=!lv[side];
    put('messages/'+el.dataset.id,Object.assign({},lm,{loved:lv}));
    if(lv[side])burstAt(e,el,5);
  }
  else if(a==='petTap'){
    ui.petTaps++;var pl=t('pet_petted');ui.petSay=pl[ui.petTaps%pl.length];
    var pb=$('pet-say');if(pb)pb.textContent=ui.petSay;
    burstAt(e,el,3);
  }
  else if(a==='mood'){
    var mo=el.dataset.m,ts=toStr(todayN()),prev=state.checkins[ts];
    put('checkins/'+ts,{date:ts,mood:mo,createdAt:prev&&prev.createdAt?prev.createdAt:Date.now()});
    ui.petSay=t('pet_'+mo);var pb2=$('pet-say');if(pb2)pb2.textContent=ui.petSay;
    if(!prev){toast(t('plusHearts',3));burstAt(e,el,6);}
  }
  else if(a==='buy'){
    var bid=el.dataset.id,cost=+el.dataset.cost,pp=state.pet||{};
    if(pp.owned&&pp.owned[bid])return;
    if(balance()<cost){toast(t('notEnough'));return;}
    var ow=Object.assign({},pp.owned||{});ow[bid]=true;
    put('pet/main',Object.assign({},pp,{owned:ow,spent:(pp.spent||0)+cost,worn:bid}));
    burstAt(e,el,5);
  }
  else if(a==='wear'){
    var wp=state.pet||{},wid=el.dataset.id;
    put('pet/main',Object.assign({},wp,{worn:wp.worn===wid?null:wid}));
  }
  else if(a==='treat'){
    var tds=toStr(todayN()),tc=0;
    Object.keys(state.hearts).forEach(function(k){if(state.hearts[k]&&state.hearts[k].date===tds)tc++;});
    if(tc>=3){toast(t('treatLimit'));return;}
    put('hearts/'+newId('h'),{n:5,date:tds,claimed:false,createdAt:Date.now()});
    toast(t('treatSent'));burstAt(e,el,5);
  }
  else if(a==='claim'){
    var gh=state.hearts[el.dataset.id];if(!gh)return;
    put('hearts/'+el.dataset.id,Object.assign({},gh,{claimed:true}));
    toast(t('plusHearts',gh.n||5));burstAt(e,el,6);
  }
  else if(a==='renamePet'){openSheet({type:'rename'});}
  else if(a==='saveName'){
    var nm=$('pet-name').value.trim().slice(0,16);
    if(nm)put('pet/main',Object.assign({},state.pet||{},{name:nm}));
    closeSheet();
  }
  else if(a==='newWish'){openSheet({type:'wish'});}
  else if(a==='editWish'){openSheet({type:'wish',id:el.dataset.id});}
  else if(a==='wishToggle'){
    var ww=state.wishes[el.dataset.id];if(!ww)return;
    var nd=!ww.done;
    put('wishes/'+el.dataset.id,Object.assign({},ww,{done:nd,doneAt:nd?Date.now():null}));
    if(nd)burstAt(e,el,4);
  }
  else if(a==='wishQuick'){
    var sg=t('sug')[+el.dataset.i];if(!sg)return;
    put('wishes/'+newId('w'),{text:sg[1],cat:sg[0],lang:ui.lang,by:ui.owner?'owner':'other',createdAt:Date.now(),done:false,doneAt:null});
    toast(t('wishAdded'));
  }
  else if(a==='saveWish'){
    var wtx=$('wish-text').value.trim(),wct=$('wish-cat').value;
    if(!wtx){toast(t('writeFirst'));return;}
    var wid2=ui.sheet.id||newId('w'),wold=state.wishes[wid2];
    var wd={text:wtx,cat:wct,lang:wold?(wold.lang||'en'):ui.lang,by:wold&&wold.by?wold.by:(ui.owner?'owner':'other'),
      createdAt:wold&&wold.createdAt?wold.createdAt:Date.now(),done:wold?!!wold.done:false,doneAt:wold&&wold.doneAt?wold.doneAt:null};
    if(wold&&wold.tr&&wold.text===wtx)wd.tr=wold.tr;
    put('wishes/'+wid2,wd);closeSheet();toast(t(wold?'wishSaved':'wishAdded'));
  }
  else if(a==='delWish'){del('wishes/'+ui.sheet.id);closeSheet();toast(t('wishDeleted'));}
  else if(a==='saveNote'){
    captureNote();
    var s=ui.sheet,text=(s.text||'').trim(),kind=s.kind||'date',date=s.date,alt=(s.alt||'').trim();
    if(!text){toast(t('writeFirst'));return;}
    if(kind==='date'&&!date){toast(t('pickDate'));return;}
    var id=s.id||newId(),old=state.messages[id];
    var bl=old?(old.lang||'en'):ui.lang,other=bl==='ko'?'en':'ko';
    var data={text:text,kind:kind,date:kind==='date'?date:null,lang:bl,
      by:(old&&old.by)?old.by:(ui.owner?'owner':'other'),
      createdAt:old&&old.createdAt?old.createdAt:Date.now()};
    if(old&&old.loved)data.loved=old.loved;
    if(alt){data.tr={};data.tr[bl]=text;data.tr[other]=alt;}
    put('messages/'+id,data);
    closeSheet();toast(t('noteSaved'));
  }
  else if(a==='delNote'){del('messages/'+ui.sheet.id);closeSheet();}
});
document.addEventListener('change',function(e){
  var id=e.target&&e.target.id;
  if(id==='msg-kind')syncKind();
  else if(id==='tour-date'&&ui.sheet&&ui.sheet.type==='tour')ui.sheet.date=e.target.value;
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet&&ui.sheet.type!=='tour')closeSheet();});

/* ---------- start-up ---------- */
function use(name){
  try{return window.claude&&window.claude.use?window.claude.use(name).catch(function(){return null;}):Promise.resolve(null);}
  catch(e){return Promise.resolve(null);}
}
function fresh(snap){
  if(snap.metadata&&snap.metadata.fromCache===false){ui.stale=false;ui.confirmed=true;clearTimeout(ui.timer);}
}
function subscribe(){
  var err=function(e){if(e&&e.code==='revoked'){ui.canWrite=false;}ui.stale=true;render();};
  db.doc('cycle/settings').onSnapshot(function(s){
    state.settings=s.exists?Object.assign({},DEF,s.data()):Object.assign({},DEF);
    ui.loaded.s=true;fresh(s);render();
    if(ui.sheet&&ui.sheet.type==='settings')renderSheet();
  },err);
  db.collection('periods').onSnapshot(function(q){
    var o={};q.docs.forEach(function(d){o[d.id]=d.data();});
    state.periods=o;ui.loaded.p=true;fresh(q);render();
  },err);
  db.collection('messages').onSnapshot(function(q){
    var o={};q.docs.forEach(function(d){o[d.id]=d.data();});
    state.messages=o;ui.loaded.m=true;fresh(q);render();
  },err);
  db.doc('pet/main').onSnapshot(function(s){state.pet=s.exists?s.data():{};fresh(s);render();},err);
  db.collection('checkins').onSnapshot(function(q){var o={};q.docs.forEach(function(d){o[d.id]=d.data();});state.checkins=o;fresh(q);render();},err);
  db.collection('hearts').onSnapshot(function(q){var o={};q.docs.forEach(function(d){o[d.id]=d.data();});state.hearts=o;fresh(q);render();},err);
  db.collection('wishes').onSnapshot(function(q){var o={};q.docs.forEach(function(d){o[d.id]=d.data();});state.wishes=o;fresh(q);render();},err);
  ui.timer=setTimeout(function(){ui.stale=true;render();},10000);
}

render();
setInterval(updateClock,20000);
Promise.all([use('db'),use('user'),use('sample')]).then(function(r){
  var d=r[0],u=r[1];
  ui.sample=r[2]||null;
  var chain=Promise.resolve();
  if(u){
    chain=Promise.resolve(u.isOwner()).then(function(o){ui.owner=!!o;})
      .then(function(){return u.can('data.write');}).then(function(w){ui.canWrite=w!==false;}).catch(function(){});
  }
  return chain.then(function(){
    if(d){db=d;ui.mode='db';subscribe();}
    else{ui.mode='local';ui.owner=false;loadLocal();}
    render();
  });
});
})();
</script>

</body></html>
